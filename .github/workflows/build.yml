name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Flutter's Windows target needs the MSVC toolchain, so this cannot build
    # on Linux.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Environment
        run: flutter doctor -v

      - name: Scaffold the Windows runner
        # The generated runner is tied to the SDK that produced it, so it is
        # created here instead of being committed. Scaffolding into a throwaway
        # project keeps `flutter create` from touching lib/.
        run: |
          $scaffold = Join-Path $env:RUNNER_TEMP 'scaffold'
          flutter create --platforms=windows --project-name tidypika $scaffold
          Copy-Item (Join-Path $scaffold 'windows') -Destination . -Recurse

          $cmake = 'windows/CMakeLists.txt'
          (Get-Content $cmake -Raw).Replace(
            'set(BINARY_NAME "tidypika")',
            'set(BINARY_NAME "TidyPika")') | Set-Content $cmake

          $runner = 'windows/runner/main.cpp'
          (Get-Content $runner -Raw).Replace(
            'L"tidypika"', 'L"TidyPika"').Replace(
            'Win32Window::Size size(1280, 720);',
            'Win32Window::Size size(1240, 860);') | Set-Content $runner

      - name: Restore packages
        run: flutter pub get

      - name: Build
        run: flutter build windows --release

      - name: Package the folder build
        # The engine DLL anchors the real output directory. Searching for a
        # folder named Release instead finds CMake's intermediate dirs.
        run: |
          $engine = Get-ChildItem build/windows -Recurse -File `
            -Filter flutter_windows.dll | Select-Object -First 1
          if (-not $engine) { throw 'build output not found' }

          $release = $engine.Directory.FullName
          Write-Host "release directory: $release"
          Get-ChildItem $release | ForEach-Object { Write-Host "  $($_.Name)" }
          "RELEASE_DIR=$release" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Compress-Archive -Path "$release\*" `
            -DestinationPath TidyPika-win-x64.zip -Force

          $raw = (Get-ChildItem $release -Recurse -File |
            Measure-Object -Property Length -Sum).Sum
          Write-Host ("unpacked: {0:N1} MB" -f ($raw / 1MB))
          Write-Host ("zipped:   {0:N1} MB" -f `
            ((Get-Item TidyPika-win-x64.zip).Length / 1MB))

      # Uploaded before the single-file step so a working build is always
      # published even if the self-extractor cannot be assembled.
      - name: Upload the folder build
        uses: actions/upload-artifact@v4
        with:
          name: TidyPika-folder
          path: TidyPika-win-x64.zip
          retention-days: 30

      - name: Build the single-file executable
        # Flutter keeps its engine DLL and assets as separate files on disk, so
        # there is no genuine one-file target. This wraps the folder in a 7-Zip
        # self-extractor: one executable that unpacks to a temp directory and
        # launches the app.
        run: |
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw '7-Zip is not installed' }

          # The SFX modules ship in the "extra" package rather than the normal
          # install, and its filename carries the version — so read the name off
          # the download page instead of guessing at version numbers.
          $page = Invoke-WebRequest 'https://www.7-zip.org/download.html' `
            -UseBasicParsing
          $names = [regex]::Matches($page.Content, '7z[0-9]+-extra\.7z') |
            ForEach-Object { $_.Value } | Select-Object -Unique
          if (-not $names) { throw 'no extra package is linked on the download page' }
          Write-Host "extra packages offered: $($names -join ', ')"

          $downloaded = $false
          foreach ($name in $names) {
            $url = "https://www.7-zip.org/a/$name"
            try {
              Write-Host "fetching $url"
              Invoke-WebRequest $url -OutFile extra.7z -UseBasicParsing
              $downloaded = $true
              break
            } catch {
              Write-Host "  failed: $($_.Exception.Message)"
            }
          }
          if (-not $downloaded) { throw 'could not download the 7-Zip extra package' }

          & $sevenZip x extra.7z -oextra -y | Out-Null
          $module = Get-ChildItem extra -Recurse -File |
            Where-Object { $_.Name -in '7zSD.sfx', '7zS.sfx' } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $module) { throw 'the extra package carries no SFX module' }
          Write-Host "sfx module: $($module.Name)"

          & $sevenZip a -t7z -mx=9 payload.7z "$env:RELEASE_DIR\*" | Out-Null

          $config = ";!@Install@!UTF-8!`r`n" +
            "RunProgram=`"TidyPika.exe`"`r`n" +
            "GUIMode=`"2`"`r`n" +
            ";!@InstallEnd@!`r`n"
          [System.IO.File]::WriteAllText(
            "$PWD\config.txt",
            $config,
            (New-Object System.Text.UTF8Encoding($false)))

          $copy = 'copy /b "{0}" + config.txt + payload.7z TidyPika.exe' `
            -f $module.FullName
          cmd /c $copy

          if (-not (Test-Path TidyPika.exe)) {
            throw 'the single-file build produced nothing'
          }
          Write-Host ("single exe: {0:N1} MB" -f `
            ((Get-Item TidyPika.exe).Length / 1MB))

      - name: Upload the single-file executable
        uses: actions/upload-artifact@v4
        with:
          name: TidyPika-exe
          path: TidyPika.exe
          retention-days: 30
