name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag to publish, e.g. v0.0.1. Blank builds without releasing.'
        required: false
        default: ''

jobs:
  build:
    # Flutter's Windows target needs the MSVC toolchain, so this cannot build
    # on Linux.
    runs-on: windows-latest

    # Needed only by the release step, which runs on tags.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Environment
        run: flutter doctor -v

      - name: Scaffold the Windows runner
        # The generated runner is tied to the SDK that produced it, so it is
        # created here instead of being committed. Scaffolding into a throwaway
        # project keeps `flutter create` from touching lib/.
        run: |
          $scaffold = Join-Path $env:RUNNER_TEMP 'scaffold'
          flutter create --platforms=windows --project-name tidypika $scaffold
          Copy-Item (Join-Path $scaffold 'windows') -Destination . -Recurse

          $cmake = 'windows/CMakeLists.txt'
          (Get-Content $cmake -Raw).Replace(
            'set(BINARY_NAME "tidypika")',
            'set(BINARY_NAME "TidyPika")') | Set-Content $cmake

          $runner = 'windows/runner/main.cpp'
          (Get-Content $runner -Raw).Replace(
            'L"tidypika"', 'L"TidyPika"').Replace(
            'Win32Window::Size size(1280, 720);',
            'Win32Window::Size size(1240, 860);') | Set-Content $runner

      - name: Restore packages
        run: flutter pub get

      - name: Build
        run: flutter build windows --release

      - name: Package the folder build
        # The engine DLL anchors the real output directory. Searching for a
        # folder named Release instead finds CMake's intermediate dirs.
        run: |
          $engine = Get-ChildItem build/windows -Recurse -File `
            -Filter flutter_windows.dll | Select-Object -First 1
          if (-not $engine) { throw 'build output not found' }

          $release = $engine.Directory.FullName
          Write-Host "release directory: $release"
          Get-ChildItem $release | ForEach-Object { Write-Host "  $($_.Name)" }
          "RELEASE_DIR=$release" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Compress-Archive -Path "$release\*" `
            -DestinationPath TidyPika-win-x64.zip -Force

          $raw = (Get-ChildItem $release -Recurse -File |
            Measure-Object -Property Length -Sum).Sum
          Write-Host ("unpacked: {0:N1} MB" -f ($raw / 1MB))
          Write-Host ("zipped:   {0:N1} MB" -f `
            ((Get-Item TidyPika-win-x64.zip).Length / 1MB))

      # Uploaded before the single-file step so a working build is always
      # published even if the self-extractor cannot be assembled.
      - name: Upload the folder build
        uses: actions/upload-artifact@v4
        with:
          name: TidyPika-folder
          path: TidyPika-win-x64.zip
          retention-days: 30

      - name: Build the single-file executable
        # tools/launcher.cs carries the folder as an embedded zip and unpacks it
        # on first run. Compiled against .NET Framework with the compiler that
        # ships in Windows, so this needs nothing downloaded and the result
        # needs no runtime installed.
        run: |
          $payload = 'payload.zip'
          Compress-Archive -Path "$env:RELEASE_DIR\*" -DestinationPath $payload -Force

          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "no C# compiler at $csc" }

          $framework = Split-Path $csc
          $compression = Join-Path $framework 'System.IO.Compression.dll'
          if (-not (Test-Path $compression)) {
            throw "System.IO.Compression.dll is missing from $framework"
          }

          # pubspec is the one place the version is written down. Its
          # 0.0.1+1 form is major.minor.patch+build; a Win32 version resource
          # wants four numbers, so the build number becomes the fourth.
          $line = Get-Content pubspec.yaml |
            Select-String '^version:\s*(.+)$' | Select-Object -First 1
          if (-not $line) { throw 'pubspec.yaml carries no version' }

          $parts = $line.Matches[0].Groups[1].Value.Trim() -split '\+'
          $version = if ($parts.Count -gt 1) {
            "$($parts[0]).$($parts[1])"
          } else {
            "$($parts[0]).0"
          }
          Write-Host "launcher version: $version"

          $source = 'launcher.generated.cs'
          (Get-Content tools/launcher.cs -Raw).Replace(
            'BUILD_ID_PLACEHOLDER',
            $env:GITHUB_SHA.Substring(0, 12)).Replace(
            'VERSION_PLACEHOLDER', $version) | Set-Content $source

          & $csc /nologo /target:winexe /optimize+ /out:TidyPika.exe `
            "/resource:$payload,$payload" `
            "/reference:$compression" `
            $source
          if ($LASTEXITCODE -ne 0) { throw "the launcher failed to compile" }

          if (-not (Test-Path TidyPika.exe)) {
            throw 'the single-file build produced nothing'
          }
          Write-Host ("single exe: {0:N1} MB" -f `
            ((Get-Item TidyPika.exe).Length / 1MB))

      - name: Upload the single-file executable
        uses: actions/upload-artifact@v4
        with:
          name: TidyPika-exe
          path: TidyPika.exe
          retention-days: 30

      # Either a pushed v* tag or a manual run naming one. The manual path
      # exists because pushing a tag is not always possible from where these
      # changes are authored; `gh release create` makes the tag itself.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          # Built as an array rather than a here-string: a here-string
          # terminator has to sit at column zero, which YAML block indentation
          # makes easy to get wrong.
          $notes = @(
            'First tagged build.',
            '',
            '### Downloads',
            '',
            '- `TidyPika.exe`: one file, nothing to unpack or install.',
            '- `TidyPika-win-x64.zip`: the plain folder build.',
            '',
            'Flutter keeps its engine and assets as separate files, so the',
            'single-file download is a launcher that unpacks once into',
            '`%LOCALAPPDATA%\TidyPika` and starts the app from there.',
            '',
            'Neither file is code-signed, so Windows may show a SmartScreen',
            'prompt, and Defender sometimes flags the single file as',
            '`Trojan:Win32/Wacatac.B!ml`. An `!ml` verdict is a',
            'machine-learning guess about an unfamiliar file rather than a',
            'match against known malware. The folder build is the same app if',
            'either gets in the way.',
            '',
            'Requires Windows 10 1809 or newer, x64.',
            '',
            '### What it does',
            '',
            '- Quick Clean across eleven cache and temp locations',
            '- Large file finder, above a size you choose',
            '- Duplicate detection confirmed by SHA-256 content hash',
            '- Per-folder disk analysis',
            '- Deletion to the Recycle Bin by default, system binaries excluded',
            '- Korean and English, switchable without a restart'
          ) -join "`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          Write-Host "publishing $tag at $env:GITHUB_SHA"

          gh release create $tag `
            TidyPika.exe `
            TidyPika-win-x64.zip `
            --target $env:GITHUB_SHA `
            --title "TidyPika $tag" `
            --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'the release could not be created' }
